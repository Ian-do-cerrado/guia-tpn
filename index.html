<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,100..900;1,75..125,100..900&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#1d4d24">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Guias do Turista por Natureza: cadastro, taxa ambiental, reembolso, titularidade, isenção, importar integrantes e comprovante.">
  <title>Turista por Natureza · Guias</title>
  <style>
    :root {
      --green: #1d4d24;
      --mint: #f3f7f5;
      --white: #fff;
      --text: #000;
      --shadow: -2px 6px 14px rgba(29, 77, 36, .18), 0 2px 6px rgba(29, 77, 36, .08);
      --shadow-hover: -3px 10px 22px rgba(29, 77, 36, .22), 0 3px 8px rgba(29, 77, 36, .1);
      --shadow-press: -1px 3px 8px rgba(29, 77, 36, .16);
      --side: max(28px, env(safe-area-inset-left));
      --side-r: max(28px, env(safe-area-inset-right));
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--green);
      color: var(--text);
      font-family: Archivo, system-ui, sans-serif;
    }
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    .shell {
      min-height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--green);
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 118px;
      padding: max(12px, env(safe-area-inset-top)) var(--side-r) 18px var(--side);
    }
    .brand {
      display: block;
      height: 72px;
      width: 155px;
      object-fit: contain;
      object-position: left center;
    }
    .lang {
      position: relative;
      flex: 0 0 auto;
    }
    .lang-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 10px;
      background: transparent;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .lang-btn:hover { background: rgba(255,255,255,.1); }
    .flag {
      display: block;
      width: 48px;
      height: auto;
      border-radius: 3px;
      overflow: hidden;
      line-height: 0;
      box-shadow: 0 0 0 1px rgba(0,0,0,.12);
    }
    .flag svg { display: block; width: 48px; height: auto; }
    .chev-lang {
      width: 12px;
      height: 12px;
      color: rgba(255,255,255,.7);
      transition: transform .2s ease;
    }
    .chev-lang.is-open { transform: rotate(180deg); }
    .lang-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 100%;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 10px;
      background: var(--green);
      box-shadow: 0 12px 28px rgba(0,0,0,.28);
      z-index: 20;
    }
    .lang-menu button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 0;
      padding: 8px 10px;
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,.1);
      background: transparent;
      cursor: pointer;
    }
    .lang-menu button:last-child { border-bottom: 0; }
    .lang-menu button:hover { background: rgba(255,255,255,.1); }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 20px 24px max(16px, env(safe-area-inset-bottom));
      border-radius: 21px 21px 0 0;
      background: var(--mint);
    }
    h1 {
      margin: 0 0 16px;
      flex: 0 0 auto;
      color: var(--green);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
      font-variation-settings: "wdth" 100;
    }
    .list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }
    .guide {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: 12px;
      min-height: 72px;
      padding: 10px 14px;
      text-decoration: none;
      color: var(--text);
      background: var(--white);
      border-radius: 18px;
      box-shadow: var(--shadow);
      animation: rise .4s ease both;
    }
    .guide:active { transform: translate(-1px, 1px); box-shadow: var(--shadow-press); }
    .icon {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--mint);
      color: var(--green);
    }
    .icon svg { width: 20px; height: 20px; }
    .guide-body { min-width: 0; flex: 1; }
    .guide .intro,
    .guide .key {
      display: block;
      margin: 0;
      font-size: 15px;
      line-height: 1.25;
      font-variation-settings: "wdth" 100;
    }
    .guide .intro { font-weight: 300; }
    .guide .key { font-weight: 700; }
    .guide .note {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.2;
      color: #4a5f57;
      font-variation-settings: "wdth" 100;
    }
    .chev {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      color: var(--green);
      opacity: .4;
    }
    .credit {
      margin: 12px 0 0;
      flex: 0 0 auto;
      text-align: center;
      color: var(--green);
      font-size: 11px;
      opacity: .4;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateX(-16px); }
      to { opacity: 1; transform: none; }
    }
    @media (min-width: 720px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        background:
          radial-gradient(900px 420px at 50% -8%, #2a6b36 0%, transparent 58%),
          #163a1b;
      }
      .shell {
        width: 100%;
        max-width: 420px;
        min-height: 0;
        height: min(760px, calc(100dvh - 64px));
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 24px 56px rgba(0, 0, 0, .32);
      }
      .top {
        min-height: 104px;
        padding: 16px 24px 14px;
      }
      .panel {
        padding: 18px 22px 16px;
      }
      .guide {
        flex: 1 1 0;
        min-height: 68px;
        max-height: none;
      }
      a:focus-visible, button:focus-visible { outline-color: #cde7d2; }
    }
    @media (min-width: 960px) {
      .shell {
        max-width: 860px;
        height: auto;
        max-height: calc(100dvh - 72px);
        overflow: auto;
      }
      .top {
        min-height: 96px;
        padding: 18px 32px 14px;
      }
      .brand {
        height: 64px;
        width: 138px;
      }
      .panel {
        padding: 22px 32px 22px;
      }
      h1 { font-size: 20px; margin-bottom: 18px; }
      .list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px 16px;
        flex: none;
      }
      .guide {
        flex: none;
        min-height: 86px;
        max-height: none;
        padding: 14px 16px;
      }
      .guide:last-child {
        grid-column: 1 / -1;
        max-width: calc((100% - 16px) / 2);
        justify-self: center;
        width: 100%;
      }
    }
    @media (hover: hover) and (pointer: fine) {
      .guide:hover {
        transform: translate(-2px, -1px);
        box-shadow: var(--shadow-hover);
      }
    }
  </style>
</head>
<body>
  <div id="app" class="shell">
    <header class="top">
      <img class="brand" src="media/logo-turista-branca.png" width="155" height="72" :alt="logoAlt">
      <div class="lang" ref="switchRef">
        <button
          type="button"
          class="lang-btn"
          :aria-expanded="open ? 'true' : 'false'"
          :aria-label="langGroup"
          @click="open = !open"
        >
          <flag-icon :code="current.code"></flag-icon>
          <svg class="chev-lang" :class="{ 'is-open': open }" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="2 3 5 7 8 3"/>
          </svg>
        </button>
        <div v-if="open" class="lang-menu" role="listbox">
          <button
            v-for="item in options"
            :key="item.code"
            type="button"
            role="option"
            :aria-label="item.label"
            @click="choose(item.code)"
          >
            <flag-icon :code="item.code"></flag-icon>
          </button>
        </div>
      </div>
    </header>

    <main class="panel">
      <h1>{{ heading }}</h1>
      <div class="list">
        <a
          v-for="(card, i) in cards"
          :key="card.href"
          class="guide"
          :href="card.href"
          :aria-label="card.title"
          :style="{ animationDelay: (0.18 + i * 0.06) + 's' }"
        >
          <span class="icon">
            <guide-icon :name="card.icon"></guide-icon>
          </span>
          <span class="guide-body">
            <span class="intro">{{ card.intro }}</span>
            <span class="key">{{ card.key }}</span>
            <span v-if="card.note" class="note">{{ card.note }}</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 6l6 6-6 6"/>
          </svg>
        </a>
      </div>
      <p class="credit">{{ credit }}</p>
    </main>
  </div>
  <script src="i18n.js"></script>
  <script src="vendor/vue.global.prod.js"></script>
  <script src="hub.js"></script>
</body>
</html>
